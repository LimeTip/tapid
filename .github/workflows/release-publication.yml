name: Protected release publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable 0.x.y release version"
        required: true
        type: string
      tag:
        description: "Immutable release tag (v0.x.y)"
        required: true
        type: string
      commit:
        description: "Full immutable commit SHA"
        required: true
        type: string
      created_at:
        description: "RFC3339 creation timestamp"
        required: true
        type: string
      expires_at:
        description: "RFC3339 expiry timestamp"
        required: true
        type: string
      base_url:
        description: "HTTPS artifact base URL"
        required: true
        type: string
      manifest_endpoints:
        description: "Ordered HTTPS manifest URLs, one per line"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign-manifest:
    name: Generate and sign release manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Bind tag to immutable commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Generate and cryptographically verify signed manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.TAPID_RELEASE_ED25519_PRIVATE_KEY }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.TAPID_RELEASE_SIGNING_KEY_ID }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.TAPID_RELEASE_ED25519_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_CREATED_AT: ${{ inputs.created_at }}
          RELEASE_EXPIRES_AT: ${{ inputs.expires_at }}
          RELEASE_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_SIGNING_KEY:-}" || { echo 'Signing secret is missing' >&2; exit 1; }
          test -n "${RELEASE_SIGNING_KEY_ID:-}" || { echo 'Signing key id is missing' >&2; exit 1; }
          test -n "${RELEASE_SIGNING_PUBLIC_KEY:-}" || { echo 'Signing public key is missing' >&2; exit 1; }
          # This is the authoritative filename -> target mapping. ZIP files are
          # passed through untouched; never extract an untrusted Windows ZIP here.
          python3 .github/release/validate_artifacts.py --version "$RELEASE_VERSION" \
            --root release-artifacts --output artifact-args
          mapfile -t artifact_args < artifact-args
          python3 .github/release/generate_manifest.py \
            --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --created-at "$RELEASE_CREATED_AT" --expires-at "$RELEASE_EXPIRES_AT" \
            --base-url "$RELEASE_BASE_URL" --output release-manifest.json "${artifact_args[@]}"
          test -s release-manifest.json
          python3 .github/release/verify_manifest.py --manifest release-manifest.json \
            --public-key "$RELEASE_SIGNING_PUBLIC_KEY"
      - name: Upload signed manifest for approved advancement
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-manifest
          path: release-manifest.json
          if-no-files-found: error

  advance-stable:
    name: Advance stable channel (approval required)
    needs: sign-manifest
    runs-on: ubuntu-latest
    environment:
      name: stable-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Download signed manifest
        uses: actions/download-artifact@v4
        with:
          name: signed-release-manifest
          path: publication
      - name: Verify immutable source and signed manifest
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.TAPID_RELEASE_ED25519_PUBLIC_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test -n "${RELEASE_SIGNING_PUBLIC_KEY:-}" || { echo 'Signing public key is missing' >&2; exit 1; }
          test -s publication/release-manifest.json
          python3 .github/release/verify_manifest.py --manifest publication/release-manifest.json \
            --public-key "$RELEASE_SIGNING_PUBLIC_KEY"
      - name: Build ordered provider-neutral stable metadata
        env:
          ENDPOINTS: ${{ inputs.manifest_endpoints }}
        run: |
          set -euo pipefail
          mapfile -t endpoints < <(printf '%s\n' "$ENDPOINTS" | sed '/^[[:space:]]*$/d')
          test "${#endpoints[@]}" -gt 0 || { echo 'No stable manifest endpoints supplied' >&2; exit 1; }
          args=()
          for endpoint in "${endpoints[@]}"; do args+=(--endpoint "$endpoint"); done
          python3 .github/release/stable_channel.py --output publication/stable.json "${args[@]}"
          test -s publication/stable.json
      - name: Publish signed manifest and stable channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ inputs.tag }}' publication/release-manifest.json publication/stable.json --clobber
