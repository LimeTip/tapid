name: Build release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      tag_commit: ${{ steps.version.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Validate annotated tag and Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "release tag must be a stable vX.Y.Z release" >&2
            exit 1
          }
          git tag -d "$RELEASE_TAG" >/dev/null 2>&1 || true
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "release tag must point to a commit on main" >&2
            exit 1
          }
          version="$(node --experimental-strip-types tools/release/release.ts check-tag "$RELEASE_TAG")"
          {
            echo "version=$version"
            echo "release_tag=$RELEASE_TAG"
            echo "tag_commit=$tag_commit"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: tapid
          - runner: macos-14
            target: aarch64-apple-darwin
            binary: tapid
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: tapid
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tapid
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tapid.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: tapid.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          cargo build --release --locked --bin tapid --target "$TARGET"
          mkdir staging release
          cp "target/$TARGET/release/$BINARY" "staging/$BINARY"
          "staging/$BINARY" --version | grep -Fx "tapid $VERSION"
          tar -czf "release/tapid-$VERSION-$TARGET.tar.gz" -C staging "$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tapid-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  draft-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tapid-*
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create checksums
        run: node --experimental-strip-types tools/release/release.ts checksums release "${{ needs.prepare.outputs.version }}"
      - name: Create draft GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          existing_releases="$(mktemp)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$existing_releases"
          if grep -Fxq "$RELEASE_TAG" "$existing_releases"; then
            echo "refusing to replace existing release $RELEASE_TAG" >&2
            exit 1
          fi

          release_fields="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f name="$RELEASE_TAG" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true --jq '[.id, .upload_url] | @tsv')"
          IFS=$'\t' read -r release_id upload_url <<< "$release_fields"
          case "$release_id" in
            ''|*[!0-9]*) echo "release creation returned an invalid ID" >&2; exit 1 ;;
          esac
          expected_upload_url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets{?name,label}"
          test "$upload_url" = "$expected_upload_url"

          matching_ids="$(mktemp)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" > "$matching_ids"
          test "$(wc -l < "$matching_ids" | tr -d ' ')" = 1
          test "$(tr -d '\r\n' < "$matching_ids")" = "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "upload_url=${upload_url%%\{*}" >> "$GITHUB_OUTPUT"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
        run: |
          release_id="$RELEASE_ID"
          case "$release_id" in
            ''|*[!0-9]*) echo "invalid release ID" >&2; exit 1 ;;
          esac
          for asset in release/*.tar.gz release/SHA256SUMS; do
            name="${asset##*/}"
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$UPLOAD_URL?name=$name" >/dev/null
          done
      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          release_id="$RELEASE_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)" = true
          find release -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > expected-assets.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name' | LC_ALL=C sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt || {
            echo "unexpected draft release assets" >&2
            exit 1
          }
