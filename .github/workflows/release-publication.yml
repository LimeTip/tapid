name: Build release candidate

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      release_id:
        required: false
        type: string
      tag_object:
        required: true
        type: string
    outputs:
      release_id:
        value: ${{ jobs.draft-release.outputs.release_id }}
      candidate_sha256:
        value: ${{ jobs.draft-release.outputs.candidate_sha256 }}
      artifact_id:
        value: ${{ jobs.draft-release.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ inputs.release_tag }}
      tag_commit: ${{ steps.version.outputs.tag_commit }}
      release_id: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - id: version
        env:
          TAG: ${{ inputs.release_tag }}
          TAG_COMMIT: ${{ inputs.commit_sha }}
          TAG_OBJECT: ${{ inputs.tag_object }}
        run: |
          set -euo pipefail
          verified_commit="$(bash tools/release/verify-source.sh "$TAG" "$TAG_COMMIT" "$TAG_OBJECT")"
          source_dir="$RUNNER_TEMP/tapid-verified-source"
          git worktree add --detach "$source_dir" "$verified_commit"
          # Execute the trusted workflow's helper against the verified source.
          version="$(cd "$source_dir" && node --experimental-strip-types "$GITHUB_WORKSPACE/tools/release/release.ts" check-tag "$TAG")"
          printf 'version=%s\ntag_commit=%s\n' "$version" "$verified_commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release_id == ''
    permissions:
      contents: read
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: tapid
          - runner: macos-14
            target: aarch64-apple-darwin
            binary: tapid
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: tapid
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tapid
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tapid.exe
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            binary: tapid.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out verified release commit
        shell: bash
        env:
          TAG_COMMIT: ${{ needs.prepare.outputs.tag_commit }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          TAG_OBJECT: ${{ inputs.tag_object }}
        run: |
          set -euo pipefail
          verified_commit="$(bash tools/release/verify-source.sh "$TAG" "$TAG_COMMIT" "$TAG_OBJECT")"
          git checkout --detach "$verified_commit"
          test "$(git rev-parse HEAD)" = "$verified_commit"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          cargo build --release --locked --bin tapid --target "$TARGET"
          mkdir staging release
          cp "target/$TARGET/release/$BINARY" "staging/$BINARY"
          "staging/$BINARY" --version | grep -Fx "tapid $VERSION"
          tar -czf "release/tapid-$VERSION-$TARGET.tar.gz" -C staging "$BINARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tapid-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error
          overwrite: true

  assemble:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Write access is necessary only to read an existing unpublished draft.
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.release_id == ''
        with:
          pattern: tapid-*
          path: release
          merge-multiple: true
      - name: Assemble or reuse exact unsigned candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
          TAG_OBJECT: ${{ inputs.tag_object }}
        run: |
          set -euo pipefail
          mkdir -p candidate release
          git show "$SOURCE_SHA:docs/releases/intent.json" > candidate/intent.json
          NOTES="$(jq -r .notes candidate/intent.json)"
          git show "$SOURCE_SHA:$NOTES" > candidate/notes.md
          VERSION="${TAG#v}"
          if test -n "$RELEASE_ID"; then
            node --experimental-strip-types tools/release/candidate.ts download "$RELEASE_ID" release "$TAG" "$SOURCE_SHA"
          else
            node --experimental-strip-types tools/release/release.ts checksums release "$VERSION"
            node --experimental-strip-types tools/release/release.ts metadata release "$VERSION" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            node --experimental-strip-types tools/release/bootstrap.ts release "$VERSION" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" "$SOURCE_SHA"
          fi
          node --experimental-strip-types tools/release/candidate.ts unsigned release candidate/notes.md candidate/intent.json "$TAG" "$SOURCE_SHA" "$TAG_OBJECT" > candidate/unsigned-result.json
          jq .candidate candidate/unsigned-result.json > candidate/unsigned.json
          mkdir -p candidate/assets
          cp -R release/. candidate/assets/
          {
            printf '### Candidate awaiting release approval\n\n'
            # shellcheck disable=SC2016
            printf 'Source: `%s`\n\nTag: `%s`\n\n' "$SOURCE_SHA" "$TAG"
            # shellcheck disable=SC2016
            printf 'Unsigned asset, notes and crate plan digests:\n\n```json\n'
            cat candidate/unsigned.json
            # shellcheck disable=SC2016
            printf '\n```\n\nReviewed release notes:\n\n'
            cat candidate/notes.md
            # shellcheck disable=SC2016
            printf '\n\nCrate versions authorized by this approval:\n\n```json\n'
            cat candidate/intent.json
            # shellcheck disable=SC2016
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: unsigned-release-candidate-${{ github.run_attempt }}
          path: candidate
          if-no-files-found: error
          retention-days: 30

  draft-release:
    environment: stable-release
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      candidate_sha256: ${{ steps.release.outputs.candidate_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Recheck candidate approved by this job
        run: |
          set -euo pipefail
          mv candidate/assets release
          node --experimental-strip-types tools/release/candidate.ts validate-unsigned release candidate/notes.md candidate/intent.json candidate/unsigned.json
      - name: Find retained authorized payload from this run
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "authorized-release-payload" and .expired == false) | .id')"
          test "$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)" -le 1
          printf 'artifact_id=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.retained.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.retained.outputs.artifact_id }}
          path: retained
          merge-multiple: true
      - name: Reuse the signature from the previously authorized payload
        if: steps.retained.outputs.artifact_id != ''
        run: |
          set -euo pipefail
          cmp retained/unsigned.json candidate/unsigned.json
          node --experimental-strip-types tools/release/candidate.ts validate-unsigned retained/assets retained/notes.md retained/intent.json retained/unsigned.json
          cp retained/assets/tapid-release-v1.tsv.sig release/tapid-release-v1.tsv.sig
      - name: Sign release metadata
        env:
          TAPID_RELEASE_SIGNING_KEY: ${{ secrets.TAPID_RELEASE_ED25519_PRIVATE_KEY }}
          TAPID_RELEASE_SIGNING_KEY_ID: ${{ vars.TAPID_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          # Reuse an existing signature byte-for-byte; its creation time is signed.
          if ! test -f release/tapid-release-v1.tsv.sig; then
            node --experimental-strip-types tools/release/sign.ts sign release/tapid-release-v1.tsv release/tapid-release-v1.tsv.sig
          fi
      - name: Verify release metadata signature
        run: node --experimental-strip-types tools/release/sign.ts verify release/tapid-release-v1.tsv release/tapid-release-v1.tsv.sig crates/tapid-signatures/data/release-keyring.json
      - name: Retain signed bytes before the first GitHub asset upload
        if: steps.retained.outputs.artifact_id == ''
        run: |
          mkdir -p candidate/assets
          cp -R release/. candidate/assets/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.retained.outputs.artifact_id == ''
        with:
          name: authorized-release-payload
          path: candidate
          if-no-files-found: error
          retention-days: 30
      - name: Create draft GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --experimental-strip-types tools/release/candidate.ts create-draft release candidate/notes.md candidate/intent.json candidate/unsigned.json > candidate/signed-result.json
          jq .candidate candidate/signed-result.json > candidate/signed.json
          {
            printf 'release_id=%s\n' "$(jq -r .release_id candidate/signed-result.json)"
            printf 'candidate_sha256=%s\n' "$(jq -r .candidate_sha256 candidate/signed-result.json)"
          } >> "$GITHUB_OUTPUT"
          mkdir -p candidate/assets
          cp -R release/. candidate/assets/
          {
            # shellcheck disable=SC2016
            printf '### Authorized signed candidate\n\n```json\n'
            cat candidate/signed-result.json
            # shellcheck disable=SC2016
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: signed-release-candidate-${{ github.run_attempt }}
          path: candidate
          if-no-files-found: error
          retention-days: 30
