name: Build release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: Validate annotated tag and Cargo version
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" origin/main || {
            echo "release tag must point to a commit on main" >&2
            exit 1
          }
          version="$(node --experimental-strip-types tools/release/release.ts check-tag "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: tapid
          - runner: macos-14
            target: aarch64-apple-darwin
            binary: tapid
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: tapid
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tapid
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tapid.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: tapid.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          cargo build --release --locked --bin tapid --target "$TARGET"
          mkdir staging release
          cp "target/$TARGET/release/$BINARY" "staging/$BINARY"
          "staging/$BINARY" --version | grep -Fx "tapid $VERSION"
          tar -czf "release/tapid-$VERSION-$TARGET.tar.gz" -C staging "$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tapid-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  draft-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tapid-*
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create checksums
        run: node --experimental-strip-types tools/release/release.ts checksums release "${{ needs.prepare.outputs.version }}"
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "refusing to replace existing release $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          find release -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > expected-assets.txt
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt || {
            echo "unexpected draft release assets" >&2
            exit 1
          }
