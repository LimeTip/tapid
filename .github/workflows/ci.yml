name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TAPID_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install relocatable Node.js for native sandbox tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Install documentation runner Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify generated release record end to end (Unix, offline)
        if: runner.os != 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          cargo build --locked --bin tapid
          python3 scripts/check-release-record.py --binary target/debug/tapid
      - name: Test executable documentation runner (Unix)
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -p test_doc_examples.py -v
      - name: Verify source documentation artifact (Unix, offline)
        if: runner.os != 'Windows'
        run: python3 scripts/check-doc-examples.py --lane source --example init --example upgrade-help --report doc-contract-source.json
      - name: Retain documentation evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doc-contract-source-${{ runner.os }}
          path: doc-contract-source.json
          retention-days: 30
          if-no-files-found: error
      - name: Run nested integration workspace
        run: cargo test --manifest-path tests/integration/Cargo.toml --locked
      - name: Validate Unix developer installer at the checked head
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/tapid-install"
          bash "$GITHUB_WORKSPACE/scripts/install.sh" \
            --repo LimeTip/tapid \
            --source-ref "$TAPID_SOURCE_REF" \
            --install-dir "$install_dir"
          "$install_dir/tapid" --help >/dev/null
          bash "$GITHUB_WORKSPACE/scripts/uninstall.sh" --install-dir "$install_dir"
          test ! -e "$install_dir/tapid"
      - name: Validate Windows developer installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'tapid-install'
          & "$env:GITHUB_WORKSPACE\scripts\install.ps1" -Repo LimeTip/tapid -SourceRef $env:TAPID_SOURCE_REF -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $installDir 'tapid.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Tapid was not installed' }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE\scripts\uninstall.ps1" -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $binary) { throw 'Tapid was not uninstalled' }
          Write-Host 'Windows developer install and uninstall passed.'

  release-platform-build:
    name: Release target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tapid
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            binary: tapid.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain and release target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release target
        shell: bash
        run: cargo build --release --locked --bin tapid --target "${{ matrix.target }}"
      - name: Verify release binary
        shell: bash
        run: test -f "target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Verify Windows installer architecture detection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne 'Arm64') {
            throw "Expected Windows Arm64 OS architecture, got $architecture"
          }

  platform-consumer-validation:
    name: Consumer validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TAPID_FIXTURE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Node.js fixture runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Build Tapid binary
        run: cargo build --bin tapid --locked
      - name: Create dynamic Node fixture project
        run: |
          node tests/fixtures/create_consumer_project.js
      - name: Verify install and lifecycle suppression; reject unsupported containment (Linux/Windows)
        if: runner.os != 'macOS'
        run: node tests/fixtures/validate_consumer_project.js
      - name: Verify native Restricted child, forwarding and exit codes (macOS)
        if: runner.os == 'macOS'
        run: node tests/fixtures/validate_consumer_project.js

  pr-published-binary-smoke:
    # Exact PR runner + immutable published binary: pre-merge regression evidence only.
    # No release readiness, installer promotion, or website evidence is produced here.
    name: PR published-binary regression (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RELEASE_TAG: v0.0.10
      RELEASE_SOURCE_SHA: 3d5f97c91f08b64a5ace26c2004081d57b88fee2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify exact PR runner and isolate directories
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne $env:EXPECTED_HEAD) { throw 'Unexpected PR runner revision' }
          $root = Join-Path $env:RUNNER_TEMP 'pr-published'
          $homeDir = Join-Path $root 'home'
          $tmpDir = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force -Path $homeDir, $tmpDir, (Join-Path $root 'bin') | Out-Null
          @("HOME=$homeDir", "USERPROFILE=$homeDir", "LOCALAPPDATA=$homeDir", "XDG_CACHE_HOME=$homeDir",
            "TMPDIR=$tmpDir", "TEMP=$tmpDir", "TMP=$tmpDir") | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "PR runner: $actual; published binary: $env:RELEASE_TAG ($env:RELEASE_SOURCE_SHA)"
      - name: Install pinned published binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          installer_url="https://raw.githubusercontent.com/LimeTip/tapid/$RELEASE_SOURCE_SHA/scripts/install.sh"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL "$installer_url" -o "$RUNNER_TEMP/pr-published/install.sh"
          env -i HOME="$HOME" TMPDIR="$TMPDIR" PATH=/usr/bin:/bin SHELL=/bin/sh \
            sh "$RUNNER_TEMP/pr-published/install.sh" --version "$RELEASE_TAG" --repo LimeTip/tapid --install-dir "$RUNNER_TEMP/pr-published/bin"
      - name: Install pinned published binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'pr-published/install.ps1'
          $installDir = Join-Path $env:RUNNER_TEMP 'pr-published/bin'
          $installerUrl = "https://raw.githubusercontent.com/LimeTip/tapid/$env:RELEASE_SOURCE_SHA/scripts/install.ps1"
          curl.exe --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL $installerUrl --output $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
            & $installer -Version $env:RELEASE_TAG -Repo LimeTip/tapid -InstallDir $installDir
            if ($LASTEXITCODE -ne 0) { throw 'Published installer failed' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $originalUserPath, 'User')
          }
      - name: Verify published identity and create isolated fixture
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'tapid.exe' } else { 'tapid' }
          $binary = Join-Path $env:RUNNER_TEMP "pr-published/bin/$exe"
          $actual = & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne 'tapid 0.0.10') { throw "Unexpected published version: $actual" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $binary | Format-List
          node tests/fixtures/create_consumer_project.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate published containment with exact PR source (not release approval)
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'tapid.exe' } else { 'tapid' }
          $binary = Join-Path $env:RUNNER_TEMP "pr-published/bin/$exe"
          # Reuse the reviewed platform contract; do not infer support from failures.
          node tests/fixtures/validate_consumer_project.js --binary $binary --release-tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release-contract:
    name: Release workflow contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Test release helpers and workflows
        run: node --experimental-strip-types --test tools/check_architecture_test.ts tools/release/release_test.ts tools/release/publish_test.ts tools/release/installers_test.ts
      - name: Check source architecture
        run: node --experimental-strip-types tools/check_architecture.ts
      - name: Validate Unix installer syntax and help
        run: |
          sh -n scripts/install.sh
          sh scripts/install.sh --help >/dev/null
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw scripts/install.ps1),
            [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  security:
    name: Dependency security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-deny
      - name: Check dependency policy and licenses
        run: cargo deny check
      - name: Install cargo-audit
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit

  windows-installer-contract:
    name: Windows installer contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and reject archive fixtures
        shell: pwsh
        run: |
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
          $fixture = Join-Path $env:RUNNER_TEMP 'tapid-installer-fixture'
          $payload = Join-Path $fixture 'payload'
          $installDir = Join-Path $fixture 'installed'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $payload 'tapid.exe'), [byte[]](1, 2, 3, 4))
          $target = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          $archiveName = "tapid-1.2.3-$target.tar.gz"
          $archive = Join-Path $fixture $archiveName
          & tar.exe -czf $archive -C $payload tapid.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          function Write-FixtureReleaseRecord {
            $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $archive).Length
            $record = "tapid-release-v1`t1.2.3`n$target`t$archiveName`t$size`t$digest`thttps://gitlab.example/tapid/releases/v1.2.3/downloads/$archiveName`n"
            Set-Content -Encoding ascii -NoNewline -Path (Join-Path $fixture 'v1.2.3.tsv') -Value $record
          }
          Write-FixtureReleaseRecord
          $installerUnderTest = Join-Path $fixture 'install.ps1'
          $installerText = Get-Content -Raw scripts/install.ps1
          $fixtureDownloader = @'
          function Save-BoundedHttpsFile([string]$Uri, [string]$Path, [long]$MaxBytes) {
              Add-Content -LiteralPath (Join-Path $env:TAPID_FIXTURE_ROOT 'requests.txt') -Value $Uri
              Copy-Item -LiteralPath (Join-Path $env:TAPID_FIXTURE_ROOT ([IO.Path]::GetFileName($Uri))) -Destination $Path
              if ((Get-Item -LiteralPath $Path).Length -gt $MaxBytes) { Fail "download exceeds the size limit" }
          }
          '@
          $downloaderPattern = [regex]::new(
            '^function Save-BoundedHttpsFile\([^\r\n]+\) \{.*?^\}',
            ([Text.RegularExpressions.RegexOptions]::Multiline -bor [Text.RegularExpressions.RegexOptions]::Singleline)
          )
          $fixtureInstallerText = $downloaderPattern.Replace($installerText, $fixtureDownloader, 1)
          if ($fixtureInstallerText -eq $installerText) { throw 'failed to create isolated installer fixture' }
          Set-Content -NoNewline -Path $installerUnderTest -Value $fixtureInstallerText
          $env:TAPID_FIXTURE_ROOT = $fixture
          Set-Content -NoNewline -Path (Join-Path $fixture 'requests.txt') -Value ''
          & $installerUnderTest -Version 1.2.3 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $installDir 'tapid.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw 'valid fixture was not installed' }
          $before = (Get-FileHash -Algorithm SHA256 $installed).Hash
          [IO.File]::WriteAllBytes((Join-Path $payload 'extra'), [byte[]](5))
          & tar.exe -czf $archive -C $payload tapid.exe extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Refresh both size and hash so this fails at archive validation, not metadata verification.
          Write-FixtureReleaseRecord
          try {
            & $installerUnderTest -Version 1.2.3 -InstallDir $installDir
            throw 'unsafe fixture was accepted'
          } catch {
            if ($_.Exception.Message -notlike '*exactly one member named tapid.exe*') { throw }
          }
          if ((Get-FileHash -Algorithm SHA256 $installed).Hash -ne $before) { throw 'rejected fixture changed the installed binary' }
          $requests = @(Get-Content -LiteralPath (Join-Path $fixture 'requests.txt'))
          $expectedRequests = @(
            'https://tapid.dev/releases/v1/v1.2.3.tsv'
            "https://gitlab.example/tapid/releases/v1.2.3/downloads/$archiveName"
            'https://tapid.dev/releases/v1/v1.2.3.tsv'
            "https://gitlab.example/tapid/releases/v1.2.3/downloads/$archiveName"
          )
          if (($requests -join "`n") -cne ($expectedRequests -join "`n")) { throw 'fixture did not use release record discovery and artifact URLs' }
          } finally {
            Remove-Item Env:TAPID_FIXTURE_ROOT -ErrorAction SilentlyContinue
            [Environment]::SetEnvironmentVariable('Path', $originalUserPath, 'User')
          }

  package:
    name: Package workspace
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1 --locked
      - name: Package all crates
        run: cargo package --workspace --locked
