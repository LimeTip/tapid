name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TAPID_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check architecture
        run: python scripts/check_architecture.py
      - name: Test architecture checker
        run: python -m unittest tests.test_check_architecture
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Run nested integration workspace
        run: cargo test --manifest-path tests/integration/Cargo.toml --locked
      - name: Validate Unix developer installer at the checked head
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/tapid-install"
          bash "$GITHUB_WORKSPACE/scripts/install.sh" \
            --repo LimeTip/tapid \
            --source-ref "$TAPID_SOURCE_REF" \
            --install-dir "$install_dir"
          "$install_dir/tapid" --help >/dev/null
          bash "$GITHUB_WORKSPACE/scripts/uninstall.sh" --install-dir "$install_dir"
          test ! -e "$install_dir/tapid"
      - name: Validate Windows developer installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'tapid-install'
          & "$env:GITHUB_WORKSPACE\scripts\install.ps1" -Repo LimeTip/tapid -SourceRef $env:TAPID_SOURCE_REF -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $installDir 'tapid.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Tapid was not installed' }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE\scripts\uninstall.ps1" -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $binary) { throw 'Tapid was not uninstalled' }
          Write-Host 'Windows developer install and uninstall passed.'

  release-platform-build:
    name: Release target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tapid
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: tapid.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain and release target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release target
        shell: bash
        run: cargo build --release --locked --bin tapid --target "${{ matrix.target }}"
      - name: Verify release binary
        shell: bash
        run: test -f "target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Verify Windows installer architecture detection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne 'Arm64') {
            throw "Expected Windows Arm64 OS architecture, got $architecture"
          }

  platform-consumer-validation:
    name: Consumer validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TAPID_FIXTURE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node.js fixture runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Tapid binary
        run: cargo build --bin tapid --locked
      - name: Create dynamic Node fixture project
        run: |
          node tests/fixtures/create_consumer_project.js
      - name: Validate install, root scripts, and lifecycle suppression (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/target/debug/tapid"
          "$bin" install --project-dir "$TAPID_FIXTURE_PROJECT" --offline --frozen
          test -d "$TAPID_FIXTURE_PROJECT/node_modules"
          test ! -e "$TAPID_FIXTURE_PROJECT/LIFECYCLE_SHOULD_NOT_RUN"
          echo 'Linux install and lifecycle suppression passed.'
          "$bin" run --project-dir "$TAPID_FIXTURE_PROJECT" test -- forwarded 0
          set +e
          "$bin" run --project-dir "$TAPID_FIXTURE_PROJECT" test -- wrong 0
          status=$?
          set -e
          test "$status" -eq 41
          echo 'Linux root-script, argument, exit-code, and lifecycle checks passed.'
      - name: Validate install, root scripts, and lifecycle suppression (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'target\debug\tapid.exe'
          & $bin install --project-dir $env:TAPID_FIXTURE_PROJECT --offline --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:TAPID_FIXTURE_PROJECT 'node_modules'))) { throw 'Tapid did not create node_modules' }
          if (Test-Path (Join-Path $env:TAPID_FIXTURE_PROJECT 'LIFECYCLE_SHOULD_NOT_RUN')) { throw 'lifecycle script ran during install' }
          Write-Host 'Windows install and lifecycle suppression passed.'
          & $bin run --project-dir $env:TAPID_FIXTURE_PROJECT test -- forwarded 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin run --project-dir $env:TAPID_FIXTURE_PROJECT test -- wrong 0
          if ($LASTEXITCODE -ne 41) { throw "Unexpected child exit code: $LASTEXITCODE" }
          Write-Host 'Windows root-script, argument, exit-code, and lifecycle checks passed.'
          exit 0

  security:
    name: Dependency security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency policy and licenses
        run: cargo deny check
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit

  package:
    name: Package workspace
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1 --locked
      - name: Package all crates
        run: cargo package --workspace --locked
