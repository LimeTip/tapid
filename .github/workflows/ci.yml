name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  news-site-consumer:
    name: News-site Tapid scripts (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TMPDIR: ${{ github.workspace }}/examples/news-site-consumer/.tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build Tapid CLI
        run: cargo build --locked --bin tapid
      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Record baseline toolchain versions
        run: |
          node --version
          npm --version
          target/debug/tapid --version
      - name: Prepare project-local build and temporary storage
        run: mkdir -p examples/news-site-consumer/.next examples/news-site-consumer/.tmp
      - name: Install npm reference tree
        run: |
          mkdir -p "$RUNNER_TEMP/news-site-npm-reference"
          cp examples/news-site-consumer/package.json examples/news-site-consumer/package-lock.json "$RUNNER_TEMP/news-site-npm-reference/"
          npm ci --prefix "$RUNNER_TEMP/news-site-npm-reference"
      - name: Install fixture with Tapid and verify replays
        shell: bash
        run: |
          set -euo pipefail
          project=examples/news-site-consumer
          target/debug/tapid install --project-dir "$project"
          lock_hash=$(sha256sum "$project/tapid.lock" | cut -d' ' -f1)
          target/debug/tapid install --frozen --project-dir "$project"
          target/debug/tapid install --offline --frozen --project-dir "$project"
          test "$(sha256sum "$project/tapid.lock" | cut -d' ' -f1)" = "$lock_hash"
      - name: Compare installed dependency graphs
        run: |
          python3 scripts/compare-news-site-package-graphs.py \
            --npm-root "$RUNNER_TEMP/news-site-npm-reference" \
            --tapid-root examples/news-site-consumer \
            --json "$RUNNER_TEMP/news-site-package-graph.json" \
            --text "$RUNNER_TEMP/news-site-package-graph.txt"
      - name: Retain dependency graph comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: news-site-package-graph
          path: |
            ${{ runner.temp }}/news-site-package-graph.json
            ${{ runner.temp }}/news-site-package-graph.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Build and test via Tapid
        run: |
          sudo -n -- env PATH="$PATH" TMPDIR="$TMPDIR" NEXT_TELEMETRY_DISABLED=1 \
            target/debug/tapid run build --allow-process-memory-stats --project-dir examples/news-site-consumer
          target/debug/tapid run test --project-dir examples/news-site-consumer
      - name: Start via Tapid and assert acceptance marker
        shell: bash
        run: |
          set -euo pipefail
          target/debug/tapid run start --project-dir examples/news-site-consumer > "$RUNNER_TEMP/news-site-consumer.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/acceptance > "$RUNNER_TEMP/news-site-acceptance.txt"; then
              break
            fi
            sleep 1
          done
          grep -Fx 'TAPID_NEWS_SITE_ACCEPTANCE_V1' "$RUNNER_TEMP/news-site-acceptance.txt"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TAPID_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      # Node 22 below owns the otherwise optional CLI assertion probes.
      TAPID_REQUIRE_NODE_ASSERTIONS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install relocatable Node.js for native sandbox tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify pinned node-semver compatibility oracle
        if: matrix.os == 'ubuntu-latest'
        working-directory: tests/node-semver-oracle
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test --offline
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        # Retain success output so each Node assertion branch has a receipt.
        run: cargo test --workspace --all-features --locked -- --show-output
      - name: Install Python for development and documentation tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify generated release record end to end (Unix, offline)
        if: runner.os != 'Windows'
        timeout-minutes: 3
        shell: bash
        run: |
          cargo build --locked --bin tapid
          python3 scripts/check-release-record.py --binary target/debug/tapid
      - name: Test executable documentation runner (Unix)
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tests -p test_doc_examples.py -v
      - name: Test development build cache selection
        run: python -m unittest discover -s tests -p test_dev.py -v
      - name: Verify source documentation artifact (Unix, offline)
        if: runner.os != 'Windows'
        run: python3 scripts/check-doc-examples.py --lane source --example init --example upgrade-help --report doc-contract-source.json
      - name: Retain documentation evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doc-contract-source-${{ runner.os }}
          path: doc-contract-source.json
          retention-days: 30
          if-no-files-found: error
      - name: Run nested integration workspace
        run: cargo test --manifest-path tests/integration/Cargo.toml --locked
      - name: Validate Unix developer installer at the checked head
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/tapid-install"
          bash "$GITHUB_WORKSPACE/scripts/install.sh" \
            --repo LimeTip/tapid \
            --source-ref "$TAPID_SOURCE_REF" \
            --install-dir "$install_dir"
          "$install_dir/tapid" --help >/dev/null
          bash "$GITHUB_WORKSPACE/scripts/uninstall.sh" --install-dir "$install_dir"
          test ! -e "$install_dir/tapid"
      - name: Validate Windows developer installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'tapid-install'
          & "$env:GITHUB_WORKSPACE\scripts\install.ps1" -Repo LimeTip/tapid -SourceRef $env:TAPID_SOURCE_REF -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $installDir 'tapid.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Tapid was not installed' }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE\scripts\uninstall.ps1" -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $binary) { throw 'Tapid was not uninstalled' }
          Write-Host 'Windows developer install and uninstall passed.'

  nextest:
    name: Nextest (Ubuntu)
    runs-on: ubuntu-latest
    env:
      TAPID_REQUIRE_NODE_ASSERTIONS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-nextest
      - name: Install Node.js 22 for same-SHA comparison
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Record Stage 5 source and tool identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage5-evidence
          jq -n --arg checkout_sha "$(git rev-parse HEAD)" --arg event_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" \
            '{checkout_sha:$checkout_sha,event_sha:$event_sha,run_id:$run_id,run_attempt:$run_attempt,job:$job,runner_os:$runner_os,runner_arch:$runner_arch,evidence_class:"experiment-not-release-evidence"}' > stage5-evidence/identity.json
          { rustc -Vv; cargo --version; node --version; } > stage5-evidence/tool-versions.txt
      - name: Discover standalone nextest identities
        run: |
          cargo nextest --version >> stage5-evidence/tool-versions.txt
          cargo nextest list --help > stage5-evidence/nextest-list-help.txt
          cargo nextest run --help > stage5-evidence/nextest-run-help.txt
          cargo nextest list --workspace --all-features --locked --message-format json > stage5-evidence/discovered.json
      - name: Run tests with nextest
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --workspace --all-features --locked 2>&1 | tee stage5-evidence/executed.log
      - name: Retain Stage 5 nextest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage5-nextest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage5-evidence/
            target/nextest/default/stage5-junit.xml
            target/llvm-cov-target/nextest/default/stage5-junit.xml
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    env:
      TAPID_REQUIRE_NODE_ASSERTIONS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-llvm-cov
      - name: Install Node.js 22 for same-SHA comparison
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Record Stage 5 source and tool identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage5-evidence
          jq -n --arg checkout_sha "$(git rev-parse HEAD)" --arg event_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" \
            '{checkout_sha:$checkout_sha,event_sha:$event_sha,run_id:$run_id,run_attempt:$run_attempt,job:$job,runner_os:$runner_os,runner_arch:$runner_arch,evidence_class:"experiment-not-release-evidence"}' > stage5-evidence/identity.json
          { rustc -Vv; cargo --version; node --version; } > stage5-evidence/tool-versions.txt
      - name: Discover standalone coverage identities (stable libtest text)
        run: |
          cargo llvm-cov --version >> stage5-evidence/tool-versions.txt
          cargo llvm-cov --help > stage5-evidence/llvm-cov-help.txt
          cargo llvm-cov --workspace --all-features --locked --no-report -- --list > stage5-evidence/discovered-libtest.txt 2>&1
      - name: Generate LCOV coverage report
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info 2>&1 | tee stage5-evidence/executed-libtest.log
      - name: Retain repository profile-write evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'stage5-evidence'
          evidence.mkdir(exist_ok=True)
          profiles = []
          for path in list(root.rglob('*.profraw')):
              relative = path.relative_to(root)
              if relative.parts[0] == 'stage5-evidence':
                  continue
              data = path.read_bytes()
              stray = relative.parts[0] != 'target'
              profiles.append({'path': str(relative), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'outside_target': stray})
              if stray:
                  destination = evidence / 'stray-profiles' / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, destination)
          (evidence / 'profile-writes.json').write_text(json.dumps({'scope': 'files surviving in checkout after execution; deleted temporary files are not observed', 'profiles': profiles}, indent=2) + '\n')
          PY
      - name: Export standalone source and function coverage
        run: |
          cargo llvm-cov report --json --output-path stage5-evidence/coverage.json
          cp lcov.info stage5-evidence/lcov.info
      - name: Retain Stage 5 coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage5-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage5-evidence/
            target/nextest/default/stage5-junit.xml
            target/llvm-cov-target/nextest/default/stage5-junit.xml
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Upload LCOV coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 30

  # Temporary parallel experiment. Originals remain authoritative; no release consumer uses this job.
  nextest-coverage-pilot:
    name: Experimental nextest + coverage (Ubuntu; not release evidence)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      TAPID_REQUIRE_NODE_ASSERTIONS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain and matching LLVM tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - name: Cache experimental instrumented Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: stage5-nextest-coverage-pilot
      - name: Install nextest and coverage tools
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Install Node.js 22 for same-SHA comparison
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Record Stage 5 source and tool identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage5-evidence
          jq -n --arg checkout_sha "$(git rev-parse HEAD)" --arg event_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" --arg runner_os "$RUNNER_OS" --arg runner_arch "$RUNNER_ARCH" \
            '{checkout_sha:$checkout_sha,event_sha:$event_sha,run_id:$run_id,run_attempt:$run_attempt,job:$job,runner_os:$runner_os,runner_arch:$runner_arch,evidence_class:"experiment-not-release-evidence"}' > stage5-evidence/identity.json
          { rustc -Vv; cargo --version; node --version; } > stage5-evidence/tool-versions.txt
      - name: Discover instrumented candidate identities
        shell: bash
        run: |
          set -euo pipefail
          { cargo nextest --version; cargo llvm-cov --version; } >> stage5-evidence/tool-versions.txt
          cargo nextest list --help > stage5-evidence/nextest-list-help.txt
          cargo nextest run --help > stage5-evidence/nextest-run-help.txt
          cargo llvm-cov nextest --help > stage5-evidence/llvm-cov-nextest-help.txt
          cargo llvm-cov report --help > stage5-evidence/llvm-cov-report-help.txt
          # Documented show-env interface; same target directory as llvm-cov's normal runner.
          (
            export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/llvm-cov-target"
            eval "$(cargo llvm-cov show-env --sh)"
            cargo nextest list --workspace --all-features --locked --message-format json > stage5-evidence/discovered.json
          )
      - name: Run experimental combined nextest and LCOV
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov nextest --workspace --all-features --locked --no-fail-fast --lcov --output-path lcov.info 2>&1 | tee stage5-evidence/executed.log
      - name: Retain repository profile-write evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root = Path.cwd()
          evidence = root / 'stage5-evidence'
          evidence.mkdir(exist_ok=True)
          profiles = []
          for path in list(root.rglob('*.profraw')):
              relative = path.relative_to(root)
              if relative.parts[0] == 'stage5-evidence':
                  continue
              data = path.read_bytes()
              stray = relative.parts[0] != 'target'
              profiles.append({'path': str(relative), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'outside_target': stray})
              if stray:
                  destination = evidence / 'stray-profiles' / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, destination)
          (evidence / 'profile-writes.json').write_text(json.dumps({'scope': 'files surviving in checkout after execution; deleted temporary files are not observed', 'profiles': profiles}, indent=2) + '\n')
          PY
      - name: Export candidate source and function coverage
        run: |
          cargo llvm-cov report --json --output-path stage5-evidence/coverage.json
          cp lcov.info stage5-evidence/lcov.info
      - name: Retain Stage 5 candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stage5-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage5-evidence/
            target/nextest/default/stage5-junit.xml
            target/llvm-cov-target/nextest/default/stage5-junit.xml
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  release-platform-build:
    name: Release target (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: tapid
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            binary: tapid.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain and release target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release target
        shell: bash
        run: cargo build --release --locked --bin tapid --target "${{ matrix.target }}"
      - name: Verify release binary
        shell: bash
        run: test -f "target/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Verify Windows installer architecture detection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -ne 'Arm64') {
            throw "Expected Windows Arm64 OS architecture, got $architecture"
          }

  platform-consumer-validation:
    name: Consumer validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TAPID_FIXTURE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Node.js fixture runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Build Tapid binary
        run: cargo build --bin tapid --locked
      - name: Create dynamic Node fixture project
        run: |
          node tests/fixtures/create_consumer_project.js
      - name: Verify install and lifecycle suppression; reject unsupported containment (Linux/Windows)
        if: runner.os != 'macOS'
        run: node tests/fixtures/validate_consumer_project.js
      - name: Verify native Restricted child, forwarding and exit codes (macOS)
        if: runner.os == 'macOS'
        run: node tests/fixtures/validate_consumer_project.js
      - name: Prepare same-run Windows CLI handoff
        if: runner.os == 'Windows'
        run: node --experimental-strip-types tools/release/ci_binary.ts prepare --directory "$env:RUNNER_TEMP/tapid-ci-cli" --binary target/debug/tapid.exe
      - name: Retain same-run Windows CLI
        if: runner.os == 'Windows'
        id: windows-cli
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-cli-${{ github.run_id }}-${{ github.run_attempt }}-windows-latest-Windows-X64-default-debug
          path: ${{ runner.temp }}/tapid-ci-cli/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
      - name: Record Windows handoff artifact identity
        if: runner.os == 'Windows'
        env:
          ARTIFACT_ID: ${{ steps.windows-cli.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.windows-cli.outputs.artifact-digest }}
        run: Write-Host "Windows CLI artifact $env:ARTIFACT_ID digest $env:ARTIFACT_DIGEST"

  pr-published-binary-smoke:
    # Exact PR runner + immutable published binary: pre-merge regression evidence only.
    # No release readiness, installer promotion, or website evidence is produced here.
    name: PR published-binary regression (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RELEASE_TAG: v0.0.10
      RELEASE_SOURCE_SHA: 3d5f97c91f08b64a5ace26c2004081d57b88fee2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify exact PR runner and isolate directories
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne $env:EXPECTED_HEAD) { throw 'Unexpected PR runner revision' }
          $root = Join-Path $env:RUNNER_TEMP 'pr-published'
          $homeDir = Join-Path $root 'home'
          $tmpDir = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Force -Path $homeDir, $tmpDir, (Join-Path $root 'bin') | Out-Null
          @("HOME=$homeDir", "USERPROFILE=$homeDir", "LOCALAPPDATA=$homeDir", "XDG_CACHE_HOME=$homeDir",
            "TMPDIR=$tmpDir", "TEMP=$tmpDir", "TMP=$tmpDir") | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "PR runner: $actual; published binary: $env:RELEASE_TAG ($env:RELEASE_SOURCE_SHA)"
      - name: Install pinned published binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          installer_url="https://raw.githubusercontent.com/LimeTip/tapid/$RELEASE_SOURCE_SHA/scripts/install.sh"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL "$installer_url" -o "$RUNNER_TEMP/pr-published/install.sh"
          env -i HOME="$HOME" TMPDIR="$TMPDIR" PATH=/usr/bin:/bin SHELL=/bin/sh \
            sh "$RUNNER_TEMP/pr-published/install.sh" --version "$RELEASE_TAG" --repo LimeTip/tapid --install-dir "$RUNNER_TEMP/pr-published/bin"
      - name: Install pinned published binary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'pr-published/install.ps1'
          $installDir = Join-Path $env:RUNNER_TEMP 'pr-published/bin'
          $installerUrl = "https://raw.githubusercontent.com/LimeTip/tapid/$env:RELEASE_SOURCE_SHA/scripts/install.ps1"
          curl.exe --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL $installerUrl --output $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
            & $installer -Version $env:RELEASE_TAG -Repo LimeTip/tapid -InstallDir $installDir
            if ($LASTEXITCODE -ne 0) { throw 'Published installer failed' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $originalUserPath, 'User')
          }
      - name: Verify published identity and create isolated fixture
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'tapid.exe' } else { 'tapid' }
          $binary = Join-Path $env:RUNNER_TEMP "pr-published/bin/$exe"
          $actual = & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne 'tapid 0.0.10') { throw "Unexpected published version: $actual" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $binary | Format-List
          node tests/fixtures/create_consumer_project.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate published containment with exact PR source (not release approval)
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'tapid.exe' } else { 'tapid' }
          $binary = Join-Path $env:RUNNER_TEMP "pr-published/bin/$exe"
          # Reuse the reviewed platform contract; do not infer support from failures.
          node tests/fixtures/validate_consumer_project.js --binary $binary --release-tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release-contract:
    name: Release workflow contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Test release helpers and workflows
        run: node --experimental-strip-types --test tools/check_architecture_test.ts tools/release/*_test.ts
      - name: Test consumer capability contracts
        run: node --test tests/fixtures/consumer_contract.test.js tests/fixtures/validate_consumer_project.test.js
      - name: Check source architecture
        run: node --experimental-strip-types tools/check_architecture.ts
      - name: Validate Unix installer syntax and help
        run: |
          sh -n scripts/install.sh
          sh scripts/install.sh --help >/dev/null
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw scripts/install.ps1),
            [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  security:
    name: Dependency security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-deny
      - name: Check dependency policy and licenses
        run: cargo deny check
      - name: Install cargo-audit
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit

  windows-installer-contract:
    name: Windows installer contract
    runs-on: windows-latest
    needs: [platform-consumer-validation]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # Failed-only reruns deliberately cannot reuse an earlier attempt's CLI.
      # Rerun the producer and verifier together, or the full workflow.
      - name: Download same-attempt Windows CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-cli-${{ github.run_id }}-${{ github.run_attempt }}-windows-latest-Windows-X64-default-debug
          path: ${{ runner.temp }}/tapid-ci-cli-download
          digest-mismatch: error
      - name: Verify same-run native verifier
        shell: pwsh
        run: |
          node --experimental-strip-types tools/release/ci_binary.ts verify --directory "$env:RUNNER_TEMP/tapid-ci-cli-download" --destination target/debug/tapid.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = [regex]::Match((Get-Content -Raw crates/tapid-cli/Cargo.toml), '(?m)^version = "([^"]+)"\r?$').Groups[1].Value
          if (-not $expected) { throw 'Missing CLI manifest version' }
          $actual = & target/debug/tapid.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne "tapid $expected") { throw "Unexpected native version: $actual" }
      - name: Install and reject archive fixtures
        shell: pwsh
        run: |
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
          $fixture = Join-Path $env:RUNNER_TEMP 'tapid-installer-fixture'
          $payload = Join-Path $fixture 'payload'
          $installDir = Join-Path $fixture 'installed'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $payload 'tapid.exe'), [byte[]](1, 2, 3, 4))
          $target = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          $archiveName = "tapid-1.2.3-$target.tar.gz"
          $archive = Join-Path $fixture $archiveName
          & tar.exe -czf $archive -C $payload tapid.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          function Write-FixtureReleaseRecord {
            $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $archive).Length
            $record = "tapid-release-v1`t1.2.3`n$target`t$archiveName`t$size`t$digest`thttps://gitlab.example/tapid/releases/v1.2.3/downloads/$archiveName`n"
            Set-Content -Encoding ascii -NoNewline -Path (Join-Path $fixture 'v1.2.3.tsv') -Value $record
            $signer = Join-Path $fixture 'sign-fixture.py'
          @'
          import importlib.util
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('check_release_record', sys.argv[1])
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.sign_record(Path(sys.argv[2]), Path(sys.argv[3]), Path(sys.argv[4]))
          '@ | Set-Content -Encoding utf8 -Path $signer
            $keyring = Join-Path $fixture 'keyring.json'
            & python.exe $signer (Join-Path $PWD 'scripts/check-release-record.py') (Join-Path $fixture 'v1.2.3.tsv') (Join-Path $fixture 'v1.2.3.tsv.sig') $keyring
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-FixtureReleaseRecord
          $installerUnderTest = Join-Path $fixture 'install.ps1'
          $installerText = Get-Content -Raw scripts/install.ps1
          $fixtureDownloader = @'
          function Save-BoundedHttpsFile([string]$Uri, [string]$Path, [long]$MaxBytes) {
              Add-Content -LiteralPath (Join-Path $env:TAPID_FIXTURE_ROOT 'requests.txt') -Value $Uri
              Copy-Item -LiteralPath (Join-Path $env:TAPID_FIXTURE_ROOT ([IO.Path]::GetFileName($Uri))) -Destination $Path
              if ((Get-Item -LiteralPath $Path).Length -gt $MaxBytes) { Fail "download exceeds the size limit" }
          }
          '@
          $downloaderPattern = [regex]::new(
            '^function Save-BoundedHttpsFile\([^\r\n]+\) \{.*?^\}',
            ([Text.RegularExpressions.RegexOptions]::Multiline -bor [Text.RegularExpressions.RegexOptions]::Singleline)
          )
          # Authenticate the real native verifier independently of the target fixture archive.
          $bootstrapDir = Join-Path $fixture 'bootstrap-assets'
          $bootstrapPayload = Join-Path $fixture 'bootstrap-payload'
          New-Item -ItemType Directory -Force -Path $bootstrapDir, $bootstrapPayload | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'target/debug/tapid.exe') -Destination (Join-Path $bootstrapPayload 'tapid.exe')
          foreach ($bootstrapTarget in @('aarch64-apple-darwin', 'x86_64-apple-darwin', 'aarch64-unknown-linux-gnu', 'x86_64-unknown-linux-gnu', 'aarch64-pc-windows-msvc', 'x86_64-pc-windows-msvc')) {
            $name = "tapid-1.0.0-$bootstrapTarget.tar.gz"
            & tar.exe -czf (Join-Path $bootstrapDir $name) -C $bootstrapPayload tapid.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -LiteralPath (Join-Path $bootstrapDir $name) -Destination (Join-Path $fixture $name)
          }
          node --experimental-strip-types tools/release/bootstrap.ts $bootstrapDir 1.0.0 'https://fixture.example/bootstrap/v1.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installerText = Get-Content -Raw (Join-Path $bootstrapDir 'install.ps1')
          $fixtureInstallerText = $downloaderPattern.Replace($installerText, $fixtureDownloader, 1)
          if ($fixtureInstallerText -eq $installerText) { throw 'failed to create isolated installer fixture' }
          # Only this fixture selects an explicit ephemeral keyring.
          $fixtureInstallerText = $fixtureInstallerText.Replace(
            '& $bootstrap __verify-release-record $recordPath $signaturePath',
            ('& $bootstrap __verify-release-record $recordPath $signaturePath --keyring ''{0}''' -f (Join-Path $fixture 'keyring.json')))
          Set-Content -NoNewline -Path $installerUnderTest -Value $fixtureInstallerText
          $env:TAPID_FIXTURE_ROOT = $fixture
          Set-Content -NoNewline -Path (Join-Path $fixture 'requests.txt') -Value ''
          & $installerUnderTest -Version 1.2.3 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $installDir 'tapid.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw 'valid fixture was not installed' }
          $before = (Get-FileHash -Algorithm SHA256 $installed).Hash
          [IO.File]::WriteAllBytes((Join-Path $payload 'extra'), [byte[]](5))
          & tar.exe -czf $archive -C $payload tapid.exe extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Refresh both size and hash so this fails at archive validation, not metadata verification.
          Write-FixtureReleaseRecord
          try {
            & $installerUnderTest -Version 1.2.3 -InstallDir $installDir
            throw 'unsafe fixture was accepted'
          } catch {
            if ($_.Exception.Message -notlike '*exactly one member named tapid.exe*') { throw }
          }
          if ((Get-FileHash -Algorithm SHA256 $installed).Hash -ne $before) { throw 'rejected fixture changed the installed binary' }
          $requests = @(Get-Content -LiteralPath (Join-Path $fixture 'requests.txt'))
          $expectedRequests = @(
            'https://tapid.dev/releases/v1/v1.2.3.tsv'
            'https://tapid.dev/releases/v1/v1.2.3.tsv.sig'
            "https://fixture.example/bootstrap/v1.0.0/tapid-1.0.0-$target.tar.gz"
            "https://gitlab.example/tapid/releases/v1.2.3/downloads/$archiveName"
            'https://tapid.dev/releases/v1/v1.2.3.tsv'
            'https://tapid.dev/releases/v1/v1.2.3.tsv.sig'
            "https://fixture.example/bootstrap/v1.0.0/tapid-1.0.0-$target.tar.gz"
            "https://gitlab.example/tapid/releases/v1.2.3/downloads/$archiveName"
          )
          if (($requests -join "`n") -cne ($expectedRequests -join "`n")) { throw 'fixture did not use release record discovery and artifact URLs' }
          $signaturePath = Join-Path $fixture 'v1.2.3.tsv.sig'
          $validSignature = [IO.File]::ReadAllBytes($signaturePath)
          [IO.File]::WriteAllBytes($signaturePath, [Text.Encoding]::ASCII.GetBytes('{}'))
          try {
            & $installerUnderTest -Version 1.2.3 -InstallDir $installDir
            throw 'invalid signature was accepted'
          } catch {
            if ($_.Exception.Message -notlike '*release record signature verification failed*') { throw }
          }
          if ((Get-FileHash -Algorithm SHA256 $installed).Hash -ne $before) { throw 'invalid signature changed installation' }
          [IO.File]::WriteAllBytes($signaturePath, $validSignature)
          [IO.File]::WriteAllBytes((Join-Path $fixture "tapid-1.0.0-$target.tar.gz"), [byte[]](1, 2, 3))
          try {
            & $installerUnderTest -Version 1.2.3 -InstallDir $installDir
            throw 'tampered bootstrap was accepted'
          } catch {
            if ($_.Exception.Message -notlike '*bootstrap archive checksum mismatch*') { throw }
          }
          if ((Get-FileHash -Algorithm SHA256 $installed).Hash -ne $before) { throw 'tampered bootstrap changed installation' }

          } finally {
            Remove-Item Env:TAPID_FIXTURE_ROOT -ErrorAction SilentlyContinue
            [Environment]::SetEnvironmentVariable('Path', $originalUserPath, 'User')
          }
          # The expected native signature failure sets LASTEXITCODE to 1.
          # Reaching this point means all rejection and preservation assertions passed.
          $global:LASTEXITCODE = 0

  package:
    name: Package workspace
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1 --locked
      - name: Package all crates
        run: cargo package --workspace --locked
