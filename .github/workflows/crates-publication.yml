name: Protected crates.io publication

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full immutable source commit SHA
        required: true
        type: string
      plan_digest:
        description: Reviewed canonical crates publication plan digest
        required: true
        type: string
      dry_run:
        description: Recompute and validate without registry mutation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Recompute credential-free publication plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      has_publications: ${{ steps.plan-state.outputs.has_publications }}
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source and inputs
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          REVIEWED_DIGEST: ${{ inputs.plan_digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEWED_DIGEST" =~ ^sha256-[0-9a-f]{64}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Use supported Python for exact archive parsing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build package archives and recompute the read-only plan
        env:
          PLAN_DIR: ${{ runner.temp }}/crates-publication-preflight
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          python3 scripts/crates_release.py plan \
            --commit "$SOURCE_COMMIT" \
            --output "$PLAN_DIR/recomputed-plan.json"
      - name: Bind the plan to the reviewed digest
        id: plan-state
        env:
          REVIEWED_DIGEST: ${{ inputs.plan_digest }}
          PLAN_PATH: ${{ runner.temp }}/crates-publication-preflight/recomputed-plan.json
          REVIEWED_PATH: ${{ runner.temp }}/crates-publication-preflight/crates-plan.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, ".github/release")
          import crates_publish
          import release_identity

          current = json.loads(Path(os.environ["PLAN_PATH"]).read_text())
          reviewed = crates_publish.recover_reviewed_plan(
              current, os.environ["REVIEWED_DIGEST"]
          )
          if reviewed.get("package_verification") != "archives-hashed-without-registry-verification":
              raise SystemExit("plan lacks exact pre-mutation archive hash evidence")
          if not reviewed.get("preflight", {}).get("ok"):
              raise SystemExit("publication preflight did not pass")
          Path(os.environ["REVIEWED_PATH"]).write_bytes(
              release_identity.canonical_json(reviewed) + b"\n"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_publications={}\n".format(
                  "true" if reviewed.get("publication_order") else "false"
              ))
          PY
      - name: Exercise the no-mutation execution path
        env:
          PLAN_DIR: ${{ runner.temp }}/crates-publication-preflight
          REVIEWED_DIGEST: ${{ inputs.plan_digest }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          python3 .github/release/crates_publish.py \
            --plan "$PLAN_DIR/crates-plan.json" \
            --expect-digest "$REVIEWED_DIGEST" \
            --commit "$SOURCE_COMMIT" \
            --progress "$PLAN_DIR/dry-run-progress.json" \
            --dry-run
      - name: Upload reviewed preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: crates-publication-preflight
          path: ${{ runner.temp }}/crates-publication-preflight/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish reviewed crates sequentially
    needs: preflight
    if: inputs.dry_run == false && needs.preflight.outputs.has_publications == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate current origin main before mutation
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Use supported Python for exact archive parsing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: crates-publication-preflight
          path: ${{ runner.temp }}/crates-publication-reviewed
      - name: Recompute plan immediately before mutation
        env:
          REVIEWED_DIR: ${{ runner.temp }}/crates-publication-reviewed
          MUTATION_DIR: ${{ runner.temp }}/crates-publication-mutation
          REVIEWED_DIGEST: ${{ inputs.plan_digest }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "$MUTATION_DIR"
          python3 scripts/crates_release.py plan \
            --commit "$SOURCE_COMMIT" \
            --output "$MUTATION_DIR/recomputed-plan.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, ".github/release")
          import crates_publish

          reviewed = json.loads(Path(os.environ["REVIEWED_DIR"], "crates-plan.json").read_text())
          recomputed = json.loads(Path(os.environ["MUTATION_DIR"], "recomputed-plan.json").read_text())
          expected = os.environ["REVIEWED_DIGEST"]
          completed = crates_publish.validate_recomputed_plan(
              reviewed, recomputed, expected
          )
          Path(os.environ["MUTATION_DIR"], "recomputed-prefix.json").write_text(
              json.dumps({"verified_prior_prefix": completed}, sort_keys=True) + "\n"
          )
          PY
      - name: Prepare exact reviewed archive bundle
        env:
          REVIEWED_DIR: ${{ runner.temp }}/crates-publication-reviewed
          MUTATION_DIR: ${{ runner.temp }}/crates-publication-mutation
          REVIEWED_DIGEST: ${{ inputs.plan_digest }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          python3 .github/release/crates_publish.py \
            --plan "$REVIEWED_DIR/crates-plan.json" \
            --expect-digest "$REVIEWED_DIGEST" \
            --commit "$SOURCE_COMMIT" \
            --progress "$MUTATION_DIR/prepare-progress.json" \
            --prepare-bundle "$MUTATION_DIR/upload-bundle"
      - name: Record credential phase start
        id: auth-start
        run: printf 'epoch=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Obtain temporary crates.io credential
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Upload and read back exact reviewed archives
        env:
          AUTH_STARTED_AT: ${{ steps.auth-start.outputs.epoch }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          REVIEWED_DIR: ${{ runner.temp }}/crates-publication-reviewed
          MUTATION_DIR: ${{ runner.temp }}/crates-publication-mutation
          REVIEWED_DIGEST: ${{ inputs.plan_digest }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          credential_deadline="$((AUTH_STARTED_AT + 1200))"
          remaining="$((credential_deadline - $(date +%s)))"
          test "$remaining" -gt 0
          timeout --foreground --signal=TERM --kill-after=5s "${remaining}s" \
            python3 .github/release/crates_publish.py \
            --plan "$REVIEWED_DIR/crates-plan.json" \
            --expect-digest "$REVIEWED_DIGEST" \
            --commit "$SOURCE_COMMIT" \
            --progress "$MUTATION_DIR/progress.json" \
            --bundle "$MUTATION_DIR/upload-bundle" \
            --http-only \
            --credential-deadline "$credential_deadline"

  verify:
    name: Verify registry publication without credentials
    needs: [preflight, publish]
    if: ${{ always() && inputs.dry_run == false && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate current origin main before verification
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Use supported Python for exact archive parsing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: crates-publication-preflight
          path: ${{ runner.temp }}/crates-publication-reviewed
      - name: Reconstruct and verify complete publication from crates.io
        env:
          REVIEWED_DIR: ${{ runner.temp }}/crates-publication-reviewed
          VERIFICATION_DIR: ${{ runner.temp }}/crates-publication-verification
          REVIEWED_DIGEST: ${{ inputs.plan_digest }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "$VERIFICATION_DIR"
          python3 .github/release/crates_publish.py \
            --plan "$REVIEWED_DIR/crates-plan.json" \
            --expect-digest "$REVIEWED_DIGEST" \
            --commit "$SOURCE_COMMIT" \
            --progress "$VERIFICATION_DIR/progress.json" \
            --dry-run \
            --require-published
      - name: Verify tapid through the registry with a clean Cargo home
        env:
          REVIEWED_DIR: ${{ runner.temp }}/crates-publication-reviewed
          VERIFICATION_DIR: ${{ runner.temp }}/crates-publication-verification
        run: |
          set -euo pipefail
          verification_root="$(mktemp -d)"
          trap 'rm -rf "$verification_root"' EXIT
          export HOME="$verification_root/home"
          export CARGO_HOME="$verification_root/cargo-home"
          export CARGO_TARGET_DIR="$verification_root/target"
          unset CARGO_REGISTRY_TOKEN CARGO_REGISTRIES_CRATES_IO_TOKEN
          cargo package -p tapid --locked
          version="$(python3 -c 'import json,os; p=json.load(open(os.path.join(os.environ["REVIEWED_DIR"], "crates-plan.json"))); print(next(x["version"] for x in p["packages"] if x["name"] == "tapid"))')"
          cargo install tapid --version "$version" --locked --root "$verification_root/install"
          test "$("$verification_root/install/bin/tapid" --version)" = "tapid $version"
          printf '%s\n' 'registry-backed package and install verification passed' > "$VERIFICATION_DIR/final-verification.txt"
      - name: Upload credential-free verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crates-publication-verification
          path: ${{ runner.temp }}/crates-publication-verification/
          if-no-files-found: warn
          retention-days: 90
