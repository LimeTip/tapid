name: Public installer smoke

run-name: Public installer smoke ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable release tag; empty resolves current latest'
        type: string
        required: false
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: public-smoke-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      runner_sha: ${{ steps.release.outputs.runner_sha }}
      latest_tag: ${{ steps.release.outputs.latest_tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      record_aware: ${{ steps.release.outputs.record_aware }}
      unix_matrix: ${{ steps.release.outputs.unix_matrix }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh api repos/LimeTip/tapid/releases/latest --jq .tag_name)"
          [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="${REQUESTED_TAG:-$latest_tag}"
          runner_sha="$(gh api repos/LimeTip/tapid/commits/main --jq .sha)"
          [[ "$runner_sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'latest_tag=%s\nrunner_sha=%s\n' "$latest_tag" "$runner_sha" >> "$GITHUB_OUTPUT"
          # Bound discovery to the latest 100 releases. Never select 0.0.9, which has no upgrader.
          gh release list --repo LimeTip/tapid --limit 100 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          LATEST_TAG="$latest_tag" python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os, re
          def version(tag):
              return tuple(map(int, tag[1:].split('.')))
          latest = version(os.environ['LATEST_TAG'])
          releases = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'releases.json')))
          candidates = [r['tagName'] for r in releases if not r['isDraft'] and not r['isPrerelease']
                        and re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', r['tagName'])
                        and (0, 0, 10) <= version(r['tagName']) < latest]
          print('previous_tag=' + (max(candidates, key=version) if candidates else ''))
          print('record_aware=' + str(latest > (0, 0, 10)).lower())
          PYTHON
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          stable="$(gh api "repos/LimeTip/tapid/releases/tags/$tag" --jq '(.draft == false) and (.prerelease == false)')"
          test "$stable" = true
          sha="$(gh api "repos/LimeTip/tapid/commits/$tag" --jq .sha)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'tag=%s\nsha=%s\n' "$tag" "$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = schedule ]; then
            printf 'unix_matrix=["ubuntu-latest"]\n' >> "$GITHUB_OUTPUT"
          else
            printf 'unix_matrix=["ubuntu-latest","macos-latest"]\n' >> "$GITHUB_OUTPUT"
          fi
  unix:
    name: Unix installer (${{ matrix.os }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.resolve.outputs.unix_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Keep the checkout ref static. The resolver output is verified below,
          # but must not control a privileged checkout ref.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify trusted runner revision
        shell: bash
        env:
          EXPECTED_RUNNER_SHA: ${{ needs.resolve.outputs.runner_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUNNER_SHA" =~ ^[a-f0-9]{40}$ ]]
          # main may have advanced since resolution; accept only its trusted history.
          git merge-base --is-ancestor "$EXPECTED_RUNNER_SHA" HEAD
          git checkout --detach "$EXPECTED_RUNNER_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNNER_SHA"
      - name: Install the published release
        id: install_published
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/tapid"
          mkdir -p "$RUNNER_TEMP/tapid-home"
          # Exercise the tagged URL rendered by the website, not its compatibility copy.
          installer_url="https://raw.githubusercontent.com/LimeTip/tapid/$RELEASE_TAG/scripts/install.sh"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL "$installer_url" -o "$RUNNER_TEMP/install.sh"
          shasum -a 256 "$RUNNER_TEMP/install.sh" > "$RUNNER_TEMP/installer-sha256.txt"
          installer_digest="$(cut -d ' ' -f 1 "$RUNNER_TEMP/installer-sha256.txt")"
          printf 'installer_url=%s\nrelease_tag=%s\nrelease_source_sha=%s\ninstaller_sha256=%s\n' \
            "$installer_url" "$RELEASE_TAG" "$RELEASE_SHA" "$installer_digest" > "$RUNNER_TEMP/installer-provenance.txt"
          env -i HOME="$RUNNER_TEMP/tapid-home" PATH=/usr/bin:/bin SHELL=/bin/sh \
            sh "$RUNNER_TEMP/install.sh" --version "$RELEASE_TAG" --install-dir "$install_dir"
          actual="$("$install_dir/tapid" --version)"
          test "$actual" = "tapid ${RELEASE_TAG#v}"
          "$install_dir/tapid" --help >/dev/null
      - name: Run canonical published quickstart
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/tapid/tapid"
          digest="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
          python3 scripts/check-doc-examples.py --lane published --example quickstart --example upgrade-help \
            --allow-network --binary "$binary" --expected-sha256 "$digest" \
            --expected-version "tapid ${RELEASE_TAG#v}" --release-tag "$RELEASE_TAG" --release-source-sha "$RELEASE_SHA" \
            --report "$RUNNER_TEMP/doc-contract-published.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Create supplemental root-script fixture (not package evidence)
        run: node tests/fixtures/create_consumer_project.js
      - name: Check published root-script containment contract
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/tapid/tapid"
          # Reviewed native contract: macOS executes; Linux fails closed.
          # Historical uncontained releases retain forwarding checks, not containment claims.
          env -i HOME="$RUNNER_TEMP/tapid-home" PATH="$PATH" TAPID_FIXTURE_PROJECT="$TAPID_FIXTURE_PROJECT" \
            node tests/fixtures/validate_consumer_project.js --binary "$binary" --release-tag "$RELEASE_TAG"
      - name: Retain published documentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doc-contract-published-${{ runner.os }}
          path: |
            ${{ runner.temp }}/doc-contract-published.json
            ${{ runner.temp }}/installer-sha256.txt
            ${{ runner.temp }}/installer-provenance.txt
            ${{ runner.temp }}/install.sh
          retention-days: 30
          if-no-files-found: error
      - name: Check the public website installer with an explicit version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL https://tapid.dev/install.sh -o "$RUNNER_TEMP/public-install.sh"
          shasum -a 256 "$RUNNER_TEMP/public-install.sh" > "$RUNNER_TEMP/public-installer-sha256.txt"
          # The public script must match latest, even when explicitly testing an older release.
          latest_installer_url="https://raw.githubusercontent.com/LimeTip/tapid/$LATEST_TAG/scripts/install.sh"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL "$latest_installer_url" -o "$RUNNER_TEMP/latest-tag-install.sh"
          shasum -a 256 "$RUNNER_TEMP/latest-tag-install.sh" >> "$RUNNER_TEMP/public-installer-sha256.txt"
          cmp "$RUNNER_TEMP/public-install.sh" "$RUNNER_TEMP/latest-tag-install.sh"
          env -i HOME="$RUNNER_TEMP/tapid-home" PATH=/usr/bin:/bin SHELL=/bin/sh \
            sh "$RUNNER_TEMP/public-install.sh" --version "$RELEASE_TAG" --install-dir "$RUNNER_TEMP/tapid-public"
          test "$("$RUNNER_TEMP/tapid-public/tapid" --version)" = "tapid ${RELEASE_TAG#v}"
          cmp "$RUNNER_TEMP/tapid-public/tapid" "$RUNNER_TEMP/tapid/tapid"
      - name: Install latest release through discovery
        id: install_latest
        # Keep discovery evidence independent of documentation/root-script failures.
        if: ${{ !cancelled() && steps.install_published.outcome == 'success' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.latest_tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/tapid-latest"
          env -i HOME="$RUNNER_TEMP/tapid-home" PATH=/usr/bin:/bin SHELL=/bin/sh sh "$RUNNER_TEMP/public-install.sh" --install-dir "$install_dir"
          test "$("$install_dir/tapid" --version)" = "tapid ${RELEASE_TAG#v}"
      - name: Run canonical published upgrade
        id: upgrade
        if: ${{ !cancelled() && steps.install_published.outcome == 'success' && steps.install_latest.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/tapid/tapid"
          target="$RUNNER_TEMP/tapid-latest/tapid"
          digest="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
          target_digest="$(shasum -a 256 "$target" | cut -d ' ' -f 1)"
          # Exact reviewed source tags only; v0.0.9 records an unsupported skip.
          # Matching tags test same-release replacement, not a previous-version upgrade.
          # A latest-release race must fail the destination digest/version checks.
          python3 scripts/check-doc-examples.py --lane published --example upgrade \
            --allow-network --binary "$binary" --expected-sha256 "$digest" \
            --expected-version "tapid ${RELEASE_TAG#v}" --release-tag "$RELEASE_TAG" --release-source-sha "$RELEASE_SHA" \
            --upgrade-target-sha256 "$target_digest" --upgrade-target-version "tapid ${LATEST_TAG#v}" \
            --report "$RUNNER_TEMP/doc-contract-upgrade.json"
      - name: Retain published upgrade evidence
        # A skipped prerequisite cannot produce a report; attempted runs must.
        if: ${{ always() && steps.upgrade.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doc-contract-upgrade-${{ runner.os }}
          path: ${{ runner.temp }}/doc-contract-upgrade.json
          retention-days: 30
          if-no-files-found: error

      - name: Check previous-version upgrade and repeat upgrade through the public service
        timeout-minutes: 5
        shell: bash
        env:
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
          RECORD_AWARE: ${{ needs.resolve.outputs.record_aware }}
        run: |
          set -euo pipefail
          if [ "$RECORD_AWARE" != true ]; then
            echo 'Skip truthful repeat assertion: releases through 0.0.10 report every reinstall as an upgrade.' | tee "$RUNNER_TEMP/public-upgrade.txt"
            exit 0
          fi
          binary="$RUNNER_TEMP/tapid-latest/tapid"
          expected_digest="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
          if [ -n "$PREVIOUS_TAG" ]; then
            env -i HOME="$RUNNER_TEMP/tapid-home" PATH=/usr/bin:/bin SHELL=/bin/sh \
              sh "$RUNNER_TEMP/public-install.sh" --version "$PREVIOUS_TAG" --install-dir "$RUNNER_TEMP/tapid-previous"
            binary="$RUNNER_TEMP/tapid-previous/tapid"
            test "$("$binary" --version)" = "tapid ${PREVIOUS_TAG#v}"
            "$binary" upgrade 2>&1 | tee "$RUNNER_TEMP/public-upgrade.txt"
            test "$("$binary" --version)" = "tapid ${LATEST_TAG#v}"
            test "$(shasum -a 256 "$binary" | cut -d ' ' -f 1)" = "$expected_digest"
          else
            echo 'Skip previous-version transition: no supported earlier release in the latest 100 releases.' | tee "$RUNNER_TEMP/public-upgrade.txt"
          fi
          "$binary" upgrade 2>&1 | tee "$RUNNER_TEMP/public-repeat-upgrade.txt"
          grep -Fx "Tapid ${LATEST_TAG#v} is already up to date" "$RUNNER_TEMP/public-repeat-upgrade.txt"
          test "$(shasum -a 256 "$binary" | cut -d ' ' -f 1)" = "$expected_digest"
      - name: Retain public website installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-installer-${{ runner.os }}
          path: |
            ${{ runner.temp }}/public-install.sh
            ${{ runner.temp }}/latest-tag-install.sh
            ${{ runner.temp }}/public-installer-sha256.txt
            ${{ runner.temp }}/public-upgrade.txt
            ${{ runner.temp }}/public-repeat-upgrade.txt
          retention-days: 30
          if-no-files-found: warn

  windows:
    name: Windows installer
    needs: resolve
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Keep the checkout ref static. The resolver output is verified below,
          # but must not control a privileged checkout ref.
          ref: main
          fetch-depth: 0
      - name: Verify trusted runner revision
        shell: pwsh
        env:
          EXPECTED_RUNNER_SHA: ${{ needs.resolve.outputs.runner_sha }}
        run: |
          if ($env:EXPECTED_RUNNER_SHA -cnotmatch '\A[a-f0-9]{40}\z') { throw 'Invalid runner revision' }
          # Check against the static main checkout before changing HEAD.
          git merge-base --is-ancestor $env:EXPECTED_RUNNER_SHA HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach $env:EXPECTED_RUNNER_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne $env:EXPECTED_RUNNER_SHA) { throw "Unexpected runner revision: $actual" }
      - name: Install the published release
        id: install_published
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install.ps1'
          $installDir = Join-Path $env:RUNNER_TEMP 'tapid'
          # curl.exe bounds the download on Windows PowerShell 5.1 as well as pwsh.
          $installerUrl = "https://raw.githubusercontent.com/LimeTip/tapid/$env:RELEASE_TAG/scripts/install.ps1"
          curl.exe --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL $installerUrl --output $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installerDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$installerDigest  install.ps1" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'installer-sha256.txt')
          @(
            "installer_url=$installerUrl"
            "release_tag=$env:RELEASE_TAG"
            "release_source_sha=$env:RELEASE_SHA"
            "installer_sha256=$installerDigest"
          ) | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'installer-provenance.txt')
          & $installer -Version $env:RELEASE_TAG -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $installDir 'tapid.exe'
          $actual = & $binary --version
          $expected = "tapid " + $env:RELEASE_TAG.TrimStart('v')
          if ($actual -ne $expected) { throw "Expected '$expected', got '$actual'" }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native published documentation contract
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'tapid/tapid.exe'
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash.ToLowerInvariant()
          & ./scripts/check-doc-examples.ps1 -AllowNetwork -Binary $binary -ExpectedSha256 $digest -ExpectedVersion ('tapid ' + $env:RELEASE_TAG.Substring(1)) -ReleaseTag $env:RELEASE_TAG -ReportPath (Join-Path $env:RUNNER_TEMP 'doc-contract-published.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Create supplemental root-script fixture (not package evidence)
        run: node tests/fixtures/create_consumer_project.js
      - name: Check published native root-script containment contract
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'tapid-home'
          $env:LOCALAPPDATA = $env:USERPROFILE
          $binary = Join-Path $env:RUNNER_TEMP 'tapid/tapid.exe'
          # Reviewed native contract rejects unsupported containment without a child or receipt.
          node tests/fixtures/validate_consumer_project.js --binary $binary --release-tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain native documentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: doc-contract-published-Windows
          path: |
            ${{ runner.temp }}/doc-contract-published.json
            ${{ runner.temp }}/installer-sha256.txt
            ${{ runner.temp }}/installer-provenance.txt
            ${{ runner.temp }}/install.ps1
          retention-days: 30
          if-no-files-found: error
      - name: Check the public website installer with an explicit version
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'public-install.ps1'
          curl.exe --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL https://tapid.dev/install.ps1 --output $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installerDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$installerDigest  public-install.ps1" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'public-installer-sha256.txt')
          # Compare against latest, not the selected historical release.
          $latestInstaller = Join-Path $env:RUNNER_TEMP 'latest-tag-install.ps1'
          $latestInstallerUrl = "https://raw.githubusercontent.com/LimeTip/tapid/$env:LATEST_TAG/scripts/install.ps1"
          curl.exe --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 --max-filesize 262144 -fsSL $latestInstallerUrl --output $latestInstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latestInstallerDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $latestInstaller).Hash.ToLowerInvariant()
          "$latestInstallerDigest  latest-tag-install.ps1" | Add-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'public-installer-sha256.txt')
          if ($installerDigest -cne $latestInstallerDigest) { throw 'Public installer differs from latest tagged installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'tapid-public'
          & $installer -Version $env:RELEASE_TAG -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $installDir 'tapid.exe'
          if ((& $binary --version) -cne ('tapid ' + $env:RELEASE_TAG.Substring(1))) { throw 'Unexpected public installation version' }
          $tagged = Join-Path $env:RUNNER_TEMP 'tapid/tapid.exe'
          if ((Get-FileHash $binary).Hash -cne (Get-FileHash $tagged).Hash) { throw 'Public and tagged installer outputs differ' }
      - name: Install latest release through discovery
        id: install_latest
        # Keep discovery evidence independent of documentation/root-script failures.
        if: ${{ !cancelled() && steps.install_published.outcome == 'success' }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.latest_tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'public-install.ps1'
          $installDir = Join-Path $env:RUNNER_TEMP 'tapid-latest'
          & $installer -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = & (Join-Path $installDir 'tapid.exe') --version
          $expected = "tapid " + $env:RELEASE_TAG.TrimStart('v')
          if ($actual -ne $expected) { throw "Expected '$expected', got '$actual'" }
      - name: Check previous-version upgrade and repeat upgrade through the public service
        timeout-minutes: 5
        shell: pwsh
        env:
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
          RECORD_AWARE: ${{ needs.resolve.outputs.record_aware }}
        run: |
          if ($env:RECORD_AWARE -ne 'true') {
            'Skip truthful repeat assertion: releases through 0.0.10 report every reinstall as an upgrade.' | Set-Content (Join-Path $env:RUNNER_TEMP 'public-upgrade.txt')
            exit 0
          }
          $binary = Join-Path $env:RUNNER_TEMP 'tapid-latest/tapid.exe'
          $expectedDigest = (Get-FileHash $binary).Hash
          if ($env:PREVIOUS_TAG) {
            $installer = Join-Path $env:RUNNER_TEMP 'public-install.ps1'
            $installDir = Join-Path $env:RUNNER_TEMP 'tapid-previous'
            & $installer -Version $env:PREVIOUS_TAG -InstallDir $installDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $binary = Join-Path $installDir 'tapid.exe'
            if ((& $binary --version) -cne ('tapid ' + $env:PREVIOUS_TAG.Substring(1))) { throw 'Unexpected previous version' }
            & $binary upgrade 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'public-upgrade.txt')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((& $binary --version) -cne ('tapid ' + $env:LATEST_TAG.Substring(1))) { throw 'Upgrade did not reach latest version' }
            if ((Get-FileHash $binary).Hash -cne $expectedDigest) { throw 'Upgrade destination digest mismatch' }
          } else {
            'Skip previous-version transition: no supported earlier release in the latest 100 releases.' | Set-Content (Join-Path $env:RUNNER_TEMP 'public-upgrade.txt')
          }
          $output = & $binary upgrade 2>&1
          $upgradeExit = $LASTEXITCODE
          $output | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'public-repeat-upgrade.txt')
          if ($upgradeExit -ne 0) { exit $upgradeExit }
          if ($output -cnotcontains ('Tapid ' + $env:LATEST_TAG.Substring(1) + ' is already up to date')) { throw 'Repeat upgrade must report already up to date' }
          if ((Get-FileHash $binary).Hash -cne $expectedDigest) { throw 'Repeat upgrade changed installed bytes' }
      - name: Retain public website installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-installer-Windows
          path: |
            ${{ runner.temp }}/public-install.ps1
            ${{ runner.temp }}/latest-tag-install.ps1
            ${{ runner.temp }}/public-installer-sha256.txt
            ${{ runner.temp }}/public-upgrade.txt
            ${{ runner.temp }}/public-repeat-upgrade.txt
          retention-days: 30
          if-no-files-found: warn
