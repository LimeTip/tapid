name: Website installer validation

on:
  pull_request:
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/website-installer-sync.yml
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/website-installer-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-installer-validation-${{ github.ref }}
  cancel-in-progress: true

# Public CI validates public inputs only. Private website changes belong in
# reviewed website PRs; this workflow never checks out or writes private code.
jobs:
  validate:
    name: Validate installers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Tapid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Shell syntax
        run: sh -n scripts/install.sh

      - name: Shell help
        run: sh scripts/install.sh --help

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw scripts/install.ps1),
            [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
