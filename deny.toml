# Keep dependency policy explicit and fail closed for known security issues.
[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

# These are the licenses actually present in the locked dependency graph.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
