[package]
name = "tapid-registry-client"
readme = "README.md"
description = "Registry metadata snapshots and transport-independent clients for Tapid"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tapid-core = { version = "0.0.2", path = "../tapid-core" }
url = "2"

[lib]
path = "src/lib.rs"
