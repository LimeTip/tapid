[package]
name = "tapid-archive"
readme = "README.md"
description = "Safe package archive validation and extraction for Tapid"
version = "0.0.6"
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = "1"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tapid-test-support = { path = "../tapid-test-support" }
