[package]
name = "tapid-attestations"
readme = "README.md"
description = "Artifact-bound attestation foundations for Tapid"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tapid-signatures = { version = "0.0.2", path = "../tapid-signatures" }

[lib]
path = "src/lib.rs"
