[package]
name = "tapid-release-client"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Provider-neutral verified Tapid release discovery and artifact fetching"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tapid-signatures = { version = "0.0.2", path = "../tapid-signatures" }
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
ed25519-dalek = "2"
