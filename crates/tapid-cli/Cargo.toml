[package]
name = "tapid"
readme = "README.md"
description = "A deterministic JavaScript and TypeScript package manager"
version = "0.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tapid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tapid-lockfile = { version = "0.0.3", path = "../tapid-lockfile" }
tapid-manifest = { version = "0.0.2", path = "../tapid-manifest" }
tapid-core = { version = "0.0.1", path = "../tapid-core" }
tapid-linker = { version = "0.0.1", path = "../tapid-linker" }
tapid-store = { version = "0.0.1", path = "../tapid-store" }
