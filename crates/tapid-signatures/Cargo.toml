[package]
name = "tapid-signatures"
readme = "README.md"
description = "Signing and verification foundations for Tapid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.23"
ed25519-dalek = "2"
serde_jcs = "0.2"

[lib]
path = "src/lib.rs"
