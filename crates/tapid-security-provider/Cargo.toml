[package]
name = "tapid-security-provider"
version = "0.0.1"
description = "Authorized retrieval of verified Tapid security evidence"
readme = "README.md"
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tapid-core = { version = "0.0.7", path = "../tapid-core" }
tapid-attestations = { version = "0.0.5", path = "../tapid-attestations" }
tapid-protocol = { version = "0.0.6", path = "../tapid-protocol" }

[dev-dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tapid-signatures = { version = "0.0.4", path = "../tapid-signatures" }
tapid-test-support = { version = "0.0.3", path = "../tapid-test-support" }

[target.'cfg(unix)'.dependencies]
fs4 = "1.1"
libc = "0.2"
sha2 = "0.10"
