[package]
name = "tapid-store"
readme = "README.md"
description = "Local content-addressed package store foundations for Tapid"
version = "0.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tapid-archive = { version = "0.0.3", path = "../tapid-archive" }
tapid-core = { version = "0.0.4", path = "../tapid-core" }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
same-file = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }
