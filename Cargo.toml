[workspace]
resolver = "3"
members = [
    "crates/tapid-core",
    "crates/tapid-store",
    "crates/tapid-cli",
    "crates/tapid-manifest",
    "crates/tapid-lockfile",
    "crates/tapid-resolver",
    "crates/tapid-registry-client",
    "crates/tapid-archive",
    "crates/tapid-linker",
    "crates/tapid-policy",
    "crates/tapid-runner",
    "crates/tapid-publish",
    "crates/tapid-test-support",
    "crates/tapid-protocol",
    "crates/tapid-signatures",
    "crates/tapid-attestations",
    "crates/tapid-transparency",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/LimeTip/tapid"
rust-version = "1.85"
authors = ["LimeTip"]
